<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
}
header {
    background: #1e88e5;
    color: white;
    padding: 20px;
    text-align: center;
}
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 30px;
}
.product {
    background: white;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.product img {
    width: 100%;
    border-radius: 8px;
}
.price {
    font-size: 18px;
    font-weight: bold;
    color: #2e7d32;
}
.stock {
    color: green;
    font-weight: bold;
}
.Nstock {
    color: rgb(255, 0, 0);
    font-weight: bold;
}
.buy-btn {
    background: #1e88e5;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 5px;
    cursor: pointer;
}
.buy-btn:hover {
    background: #1565c0;
}
.Nbuy-btn {
    background: #ff0000;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 5px;
    cursor: pointer;
}
.Nbuy-btn:hover {
    background: #830000;
}
.back {
    text-align: center;
    margin: 20px;
}
.back a {
    text-decoration: none;
    color: #1e88e5;
    font-weight: bold;
}
.best-deal{
    display:inline-block;
    padding:12px 18px;
    border-radius:12px;
    background:linear-gradient(135deg,#1e88e5,#42a5f5);
    color:white;
    box-shadow:0 0 15px rgba(30,136,229,.6);
    position:relative;
    overflow:hidden;
    animation:pulse 2s infinite;
}

.best-deal .shine{
    font-weight:bold;
    font-size:18px;
    position:relative;
    z-index:2;
}

/* SHINE EFFECT */
.best-deal::after{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width:50%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.6),
        transparent
    );
    animation:shine 2.5s infinite;
}

/* COUNTDOWN */
.countdown{
    margin-top:6px;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
}

/* Animations */
@keyframes shine{
    0%{left:-60%}
    100%{left:120%}
}
@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.04)}
    100%{transform:scale(1)}
}
</style>
</head>

<body>
<header>
    <h1>😎 Cloths For Boys</h1>
</header>

<div class="products">

  <!-- PRODUCT 1 -->
<div class="product">

     
         
           

    <img src="product photos/cloths for boys/C_P001.jpg">
    <h3>Coti</h3>

      <h4>Size : For 5-7 Years</h4>
    <p class="price">₹100</p>
    <p class="stock">✔ In Stock</p>
    <p class="stock"><b>📦 FREE DELIVERY</b></p>
    <button class="buy-btn" onclick="buyNow('C_P001','Coti','100')">Buy Now</button>
</div>

<!-- PRODUCT 2 -->
<div class="product">
  
             
                 
        
                        
     <img src="product photos/cloths for boys/C_P002.jpg">

    <h3>Coti</h3>
   
    <h4>Size : For 5-7 Years</h4>
    <p class="price">₹100</p>
    <p class="stock">✔ In Stock</p>
      <p class="stock"><b>📦 FREE DELIVERY</b></p>
    <button class="buy-btn" onclick="buyNow('C_P002','Coti','100')">Buy Now</button>
</div>


</div>

<div class="back">
    <a href="main.html">⬅ Back to Categories</a>
</div>

<script>

// Set deal end time (example: 6 hours)
const dealEnd = new Date().getTime() + (6 * 60 * 60 * 1000);

setInterval(()=>{
    const now = new Date().getTime();
    let diff = dealEnd - now;

    if(diff <= 0){
        document.getElementById("dealTimer").innerText = "EXPIRED";
        return;
    }

    let h = Math.floor(diff / (1000*60*60));
    let m = Math.floor((diff % (1000*60*60)) / (1000*60));
    let s = Math.floor((diff % (1000*60)) / 1000);

    document.getElementById("dealTimer").innerText =
        ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')};
},1000);

</script>

<script>
function buyNow(id, name, price){
    window.location.href =
    `order.html?pid=${id}&pname=${name}&price=${price}`;
}
</script>

</body>
</html>
