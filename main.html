<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>welcome | supercart grocer</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('loadingbg.jpg'); /* Replace with your image */
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    #loadingText {
      font-size: 20px;
      margin-bottom: 10px;
      color: white;
      text-shadow: 1px 1px 3px black;
    }

    .loadingBarContainer {
      width: 70%;
      height: 20px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 40px;
    }

    .loadingBar {
      height: 100%;
      width: 0%;
      background: limegreen;
      transition: width 0.2s;
    }
  </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingScreen">
  <div id="loadingText">Loading... 0%</div>
  <div class="loadingBarContainer">
    <div class="loadingBar" id="loadingBar"></div>
  </div>
</div>

<script>
  let progress = 0;
  const bar = document.getElementById('loadingBar');
  const text = document.getElementById('loadingText');

  const interval = setInterval(() => {
    progress += 1;
    bar.style.width = progress + '%';
    text.textContent = 'Loading... ' + progress + '%';

    if (progress >= 100) {
      clearInterval(interval);
      // Redirect to another page after 0.5s delay
      setTimeout(() => {
        window.location.href = 'start.html'; // Change to your target page
      }, 500);
    }
  }, 30); // Simulated loading every 30ms
</script>

</body>
</html>
